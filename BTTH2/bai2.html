<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đồ Án Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stats-card { border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; text-align: center; }
        .badge-title { background-color: #6c757d; color: white; padding: 10px 20px; border-radius: 20px; display: inline-block; }
    </style>
</head>
<body>

<div class="container mt-3">
    <!-- Navbar -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <div>
            <span class="text-primary fw-bold me-3">Quản lý Đồ Án Sinh Viên</span>
            <a href="#" class="text-decoration-none text-dark me-2 small">TrangChủ</a>
            <a href="#" class="text-decoration-none text-dark me-2 small">ĐồÁn</a>
            <a href="#" class="text-decoration-none text-dark small">ThốngKê</a>
        </div>
        <div class="small">EN | VI</div>
    </div>

    <!-- Title & Stats -->
    <div class="text-center mb-4">
        <h3 class="badge-title mb-4">Chào mừng đến với Đồ án tốt nghiệp</h3>
        <div class="row justify-content-center">
            <div class="col-md-3">
                <div class="stats-card">
                    <p class="mb-0 fw-bold">Tổng số Đồ án</p>
                    <small>228</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <p class="mb-0 fw-bold">Hoàn thành</p>
                    <small>213</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <p class="mb-0 fw-bold">Đang làm</p>
                    <small>15</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
            <input type="text" class="form-control form-control-sm" placeholder="Filter by student or title..." style="width: 250px;">
            <button class="btn btn-outline-secondary btn-sm">Lọc</button>
        </div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#projectModal">Thêm Đồ án</button>
    </div>

    <!-- Data Table -->
    <table class="table table-bordered table-hover align-middle text-center small">
        <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Tiêu đề</th>
                <th>Sinh viên</th>
                <th>Email</th>
                <th>Điện thoại</th>
                <th>Giảng viên HD</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>AI Chatbot</td>
                <td>Nguyễn Văn A</td>
                <td>a@example.com</td>
                <td>0123456789</td>
                <td>TS. Trần B</td>
                <td>
                    <button class="btn btn-secondary btn-sm" style="font-size: 0.7rem;">Sửa</button>
                    <button class="btn btn-danger btn-sm" style="font-size: 0.7rem;">Xóa</button>
                </td>
            </tr>
            <!-- Thêm các thẻ tr tương tự cho mục 2, 3, 4, 5... -->
        </tbody>
    </table>
</div>

<!-- Modal Thêm/Sửa Đồ án (Pop-up) -->
<div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Thêm/Sửa Đồ án</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label small">Tiêu đề Đồ án</label>
                        <input type="text" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Tên Sinh viên</label>
                        <input type="text" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Email</label>
                        <input type="email" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Điện thoại</label>
                        <input type="text" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Mật khẩu</label>
                        <input type="password" class="form-control form-control-sm">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small">Giảng viên HD</label>
                        <select class="form-select form-select-sm">
                            <option>TS. Trần B</option>
                            <option>TS. Lê D</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary btn-sm">Lưu</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
